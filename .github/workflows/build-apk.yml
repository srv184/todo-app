# Build the Android application in GitHub Actions on a cloud Ubuntu runner,
# which provides the Linux toolchain needed for a consistent Android build.
name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Make gradlew executable
        run: chmod +x frontend/android/gradlew

      - name: Build release APK
        # A release build packages the React Native JavaScript bundle into the
        # APK, so the installed app runs without a local Metro development server.
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
